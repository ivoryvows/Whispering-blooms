<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
}

html{
    margin:0;
    padding:0;
    width:100%;
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    width:100%;

    font-family:'Cormorant Garamond',serif;

    color:#5c2330;

    overflow-x:hidden;

    /* IMPORTANT:
       PAGE IS LOCKED UNTIL GATE VIDEO FINISHES
    */
}

body.gateLocked{
    overflow:hidden !important;
    height:100vh !important;
}


/* =====================================================
   MAIN PAGE
===================================================== */

.page{

    position:relative;

    width:100%;

    min-height:100vh;

    overflow:hidden;

    background:

    linear-gradient(
        180deg,

        #fbf5e9 0%,

        #f9f0e8 15%,

        #eef4e9 30%,

        #f8e9e7 45%,

        #f5eee4 60%,

        #eaf2e8 75%,

        #f8eee9 88%,

        #faf4e9 100%
    );
}


/* soft background glow */

.page::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:0;

    background:

    radial-gradient(
        circle at 10% 15%,
        rgba(246,215,215,.45),
        transparent 25%
    ),

    radial-gradient(
        circle at 90% 32%,
        rgba(211,231,211,.48),
        transparent 27%
    ),

    radial-gradient(
        circle at 35% 55%,
        rgba(249,231,205,.35),
        transparent 28%
    ),

    radial-gradient(
        circle at 80% 78%,
        rgba(226,239,222,.42),
        transparent 28%
    );
}


/* =====================================================
   FLOWER BACKGROUND
===================================================== */

.flower-background{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    z-index:1;

    pointer-events:none;

    overflow:hidden;
}


.flower{

    position:absolute;

    width:135px;

    opacity:.70;

    animation:floatFlower 7s ease-in-out infinite;
}


.flower img{

    width:100%;

    height:auto;

    display:block;
}


@keyframes floatFlower{

    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-10px) rotate(2deg);
    }
}


/* LEFT */

.f1{
    left:-42px;
    top:4%;
}

.f2{
    left:-45px;
    top:20%;
    animation-delay:1s;
}

.f3{
    left:-38px;
    top:36%;
    animation-delay:2s;
}

.f4{
    left:-45px;
    top:52%;
    animation-delay:3s;
}

.f5{
    left:-38px;
    top:68%;
    animation-delay:4s;
}

.f6{
    left:-45px;
    top:84%;
    animation-delay:5s;
}


/* RIGHT */

.f7{
    right:-42px;
    top:11%;
    animation-delay:1s;
}

.f8{
    right:-45px;
    top:27%;
    animation-delay:2s;
}

.f9{
    right:-38px;
    top:43%;
    animation-delay:3s;
}

.f10{
    right:-45px;
    top:59%;
    animation-delay:4s;
}

.f11{
    right:-38px;
    top:75%;
    animation-delay:5s;
}

.f12{
    right:-45px;
    top:91%;
    animation-delay:6s;
}


/* =====================================================
   CONTENT
===================================================== */

.invitation-content{

    position:relative;

    z-index:5;

    width:100%;
}


/* =====================================================
   GATE SCREEN
===================================================== */

#gateScreen{

    position:fixed;

    inset:0;

    width:100vw;

    height:100vh;

    z-index:999999;

    background:#f8f1e7;

    overflow:hidden;

    display:flex;

    justify-content:center;

    align-items:center;

    opacity:1;

    visibility:visible;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}


#gateScreen.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


/* GATE VIDEO */

#gateVideo{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}


/* TAP BUTTON */

#tapOpen{

    position:absolute;

    z-index:1000000;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    padding:13px 30px;

    border-radius:40px;

    border:1px solid rgba(255,255,255,.85);

    background:rgba(91,28,43,.82);

    color:#fff;

    font-family:'Cormorant Garamond',serif;

    font-size:21px;

    letter-spacing:2px;

    white-space:nowrap;

    box-shadow:
        0 5px 25px rgba(0,0,0,.25);

    transition:opacity .5s ease;
}


#tapOpen.hide{

    opacity:0;

    pointer-events:none;
}


/* =====================================================
   GENERAL SECTION
===================================================== */

.section{

    position:relative;

    z-index:5;

    width:100%;

    padding:22px 18px;

    text-align:center;
}


/* remove huge spaces */

.section + .section{

    padding-top:10px;
}


.section-title{

    margin:0 0 8px;

    font-family:'Alex Brush',cursive;

    font-size:42px;

    line-height:1;

    color:#742638;
}


.section-subtitle{

    margin:0 0 10px;

    font-family:'Montserrat',sans-serif;

    font-size:11px;

    letter-spacing:2px;

    text-transform:uppercase;

    color:#87626a;
}


/* =====================================================
   PARENTS
===================================================== */

.parents-section{

    padding-top:18px;

    padding-bottom:10px;
}


.parents-video{

    width:100%;

    max-width:600px;

    display:block;

    margin:0 auto;

    border-radius:14px;

    box-shadow:
        0 8px 25px rgba(91,40,50,.12);
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown-section{

    padding-top:8px;

    padding-bottom:10px;
}


.countdown-frame{

    width:100%;

    max-width:570px;

    margin:0 auto;

    padding:10px;

    border-radius:18px;

    background:rgba(255,255,255,.38);

    border:1px solid rgba(139,93,77,.18);

    box-shadow:
        0 8px 25px rgba(91,40,50,.08);
}


.countdown-overlay{

    width:55%;

    max-width:500px;

    min-width:230px;

    margin:-2px auto 0;

    position:relative;

    z-index:10;
}


.countdown-overlay a{

    display:block;

    width:100%;

    padding-bottom:24%;

    position:relative;

    overflow:hidden;
}


/* =====================================================
   EVENT SECTIONS
===================================================== */

.event-section{

    padding-top:12px;

    padding-bottom:10px;
}


.event-video{

    width:100%;

    max-width:560px;

    display:block;

    margin:0 auto 8px;

    border-radius:15px;

    box-shadow:
        0 7px 22px rgba(91,40,50,.12);
}


.event-name{

    margin:3px 0 7px;

    font-family:'Alex Brush',cursive;

    font-size:38px;

    line-height:1;

    color:#742638;
}


/* =====================================================
   MAP
===================================================== */

.map{

    width:100%;

    max-width:560px;

    height:210px;

    margin:0 auto;

    border-radius:15px;

    overflow:hidden;

    border:1px solid rgba(116,38,56,.18);

    box-shadow:
        0 7px 20px rgba(91,40,50,.10);
}


/* =====================================================
   DRESS CODE
===================================================== */

.dress-section{

    padding-top:15px;

    padding-bottom:12px;
}


.dress-image{

    display:block;

    width:100%;

    max-width:650px;

    height:auto;

    margin:0 auto;

    border-radius:15px;

    box-shadow:
        0 8px 25px rgba(91,40,50,.12);
}


/* =====================================================
   RSVP
===================================================== */

.rsvp-section{

    padding-top:14px;

    padding-bottom:18px;
}


.rsvp-box{

    width:100%;

    max-width:560px;

    margin:0 auto;

    padding:24px 20px;

    border-radius:18px;

    background:

        rgba(255,255,255,.60),

    box-shadow:

}


.rsvp-box h2{

    margin:0 0 15px;

    font-family:'Alex Brush',cursive;

    font-size:43px;

    color:#742638;
}


.rsvp-label{

    display:block;

    text-align:left;

    margin:10px 0 5px;

    font-family:'Montserrat',sans-serif;

    font-size:11px;

    letter-spacing:1px;

    color:#6c3b46;
}


.rsvp-input,
.rsvp-select{

    width:100%;

    padding:11px 12px;

    border-radius:9px;

    border:1px solid rgba(116,38,56,.25);

    background:rgba(255,255,255,.65);

    font-family:'Montserrat',sans-serif;

    font-size:13px;

    outline:none;
}


.rsvp-options{

    display:flex;

    flex-direction:column;

    gap:7px;

    text-align:left;
}


.rsvp-option{

    padding:9px 10px;

    border-radius:9px;

    background:rgba(255,255,255,.45);

    border:1px solid rgba(116,38,56,.15);

    font-family:'Cormorant Garamond',serif;

    font-size:16px;

    color:#642b39;
}


.rsvp-button{

    width:100%;

    margin-top:16px;

    padding:13px;

    border:0;

    border-radius:30px;

    background:#742638;

    color:#fff;

    font-family:'Cormorant Garamond',serif;

    font-size:18px;

    letter-spacing:1px;
}


.rsvp-message{

    margin-top:10px;

    font-family:'Montserrat',sans-serif;

    font-size:11px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    position:relative;

    z-index:5;

    text-align:center;

    padding:20px 15px 30px;

    background:rgba(248,243,234,.40);
}


.footer-script{

    margin:0;

    font-family:'Alex Brush',cursive;

    font-size:35px;

    color:#742638;

.footer-small{

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .flower{

        opacity:.62;
    }


    #tapOpen{

    .countdown-overlay{

    .event-section{

    }


    .event-video{

    }


    .map{

        height:185px;

    }


    .dress-section{

    }


    .rsvp-section{

        padding-top:9px;

        padding-bottom:12px;
    }


    .rsvp-box{

        padding:20px 15px;
    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media(max-width:380px){

    .flower{

        width:85px;
    }


    .countdown-overlay{

        width:68%;

        min-width:195px;
    }


    .map{

        height:170px;
    }

}

</style>

<script>

/* =====================================================
   GATE + MUSIC
===================================================== */

const gateScreen =
    document.getElementById("gateScreen");

const gateVideo =
    document.getElementById("gateVideo");

const tapOpen =
    document.getElementById("tapOpen");


/*
   KEEP PAGE LOCKED
*/

document.body.classList.add("gateLocked");


/*
   TAP TO OPEN
*/

tapOpen.addEventListener("click", function(){

    tapOpen.classList.add("hide");

    gateVideo.currentTime = 0;

    gateVideo.play().catch(function(error){

        console.log(error);

    });


    /*
       MUSIC
    */

    const music =
        new Audio("dekha tenu.mp3");

    music.loop = true;

    music.volume = 0.7;

    music.play().catch(function(error){

        console.log(error);

    });

});


/*
   VIDEO FINISHED
*/

gateVideo.addEventListener("ended", function(){

    /*
       Keep final frame briefly
    */

    setTimeout(function(){

        gateScreen.classList.add("hide");

        /*
           NOW PAGE CAN SCROLL
        */

        document.body.classList.remove("gateLocked");

    },500);

});



/* =====================================================
   MAP FUNCTION
===================================================== */

function createMap(id, lat, lng, title){

    const map =
        L.map(id,{
            scrollWheelZoom:false
        }).setView(
            [lat,lng],
            14
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
            '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    L.marker([lat,lng])
        .addTo(map)
        .bindPopup(title)
        .openPopup();


    /*
       Fix map display when section becomes visible
    */

    setTimeout(function(){

        map.invalidateSize();

    },500);
}



/* =====================================================
   MAPS
===================================================== */


/* DHOLKI */

createMap(
    "mapDholki",
    31.4705,
    74.4105,
    "Royal Palace"
);


/* MEHNDI */

createMap(
    "mapMehndi",
    31.5204,
    74.3587,
    "Le Aura Grand Events & Hotel"
);


/* SHADI */

createMap(
    "mapShadi",
    31.4075,
    74.2320,
    "Shershah Palace"
);


/* WALIMA */

createMap(
    "mapWalima",
    31.5204,
    74.3587,
    "Grand Vista Marquee Lahore"
);



/* =====================================================
   RSVP
===================================================== */

document
.getElementById("rsvpForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const name =
        document.getElementById("guestName").value;


    const attendance =
        document.querySelector(
            'input[name="attendance"]:checked'
        ).value;


    const guests =
        document.getElementById("guestCount").value;


    const message =
        document.getElementById("rsvpMessage");


    message.innerText =
        "Submitting your RSVP...";


    /*
       YOUR EXISTING GOOGLE APPS SCRIPT
    */

    const scriptURL =
    "https://script.google.com/macros/s/AKfycbwhcI7eEUuhAeb9LDD_iOQV1yOXX-iSxou8kYnM_B9J6Z9Fxjma_F5E0-zGMMi_fKo/exec";


    fetch(scriptURL,{

        method:"POST",

        mode:"no-cors",

        headers:{
            "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
        "name=" +
        encodeURIComponent(name) +

        "&attendance=" +
        encodeURIComponent(attendance) +

        "&guests=" +
        encodeURIComponent(guests)

    })
    .then(function(){

        message.innerText =
            "Thank you! Your RSVP has been received. ❤️";

        document
        .getElementById("rsvpForm")
        .reset();

    })
    .catch(function(){

        message.innerText =
            "Something went wrong. Please try again.";

    });

});

</script>
