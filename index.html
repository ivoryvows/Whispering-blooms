
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Timeless Grace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    overflow-x:hidden;
    font-family:"Cormorant Garamond",serif;
    color:#633737;
    background:#f8f2e8;
}

/* BACKGROUND */

#background{
    position:fixed;
    inset:0;
    z-index:-20;
    transition:background 1.5s ease;
}

#background.original{
    background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.75),transparent 38%),
    radial-gradient(circle at 85% 75%,rgba(235,220,198,.45),transparent 42%),
    #f8f2e8;
}

#background.pink{
    background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.6),transparent 38%),
    radial-gradient(circle at 85% 80%,rgba(243,190,204,.48),transparent 43%),
    #f5dfe4;
}

#background.green{
    background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.65),transparent 38%),
    radial-gradient(circle at 85% 80%,rgba(181,210,187,.5),transparent 43%),
    #e1ede2;
}

#background.gold{
    background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.65),transparent 38%),
    radial-gradient(circle at 85% 80%,rgba(222,194,133,.48),transparent 43%),
    #f0e5c7;
}

/* GLITTER */

#glitter{
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;
    overflow:hidden;
}

.sparkle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:rgba(173,136,65,.62);
    box-shadow:0 0 7px rgba(196,157,78,.6);
    animation:twinkle 4s ease-in-out infinite;
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.6);
    }
    50%{
        opacity:.85;
        transform:scale(1.35);
    }
}

/* SOUND */

#soundButton{
    position:fixed;
    right:13px;
    top:13px;
    z-index:99999;
    padding:8px 13px;
    border:1px solid rgba(169,133,65,.7);
    border-radius:30px;
    background:rgba(255,250,240,.9);
    color:#743737;
    font-family:"Montserrat",sans-serif;
    font-size:10px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    cursor:pointer;
}

/* DOOR GATE */

#gate{
    position:fixed;
    inset:0;
    z-index:50000;
    overflow:hidden;
    background:#f8f2e8;
    transition:opacity 1.2s ease,visibility 1.2s ease;
}

#gate.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

#doorStill,
#doorVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
}

#doorStill{
    z-index:2;
    opacity:1;
    transition:opacity 1.15s ease;
    cursor:pointer;
    pointer-events:auto;
}

#doorVideo{
    z-index:1;
    opacity:0;
    background:#f8f2e8;
}

#gate::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    background:
    linear-gradient(
        to bottom,
        rgba(40,10,10,.08),
        transparent 35%,
        rgba(40,10,10,.08)
    );
}

#tapArea{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    padding-bottom:12vh;
    cursor:pointer;
    transition:opacity:.6s ease;
}

#tapText{
    color:#fffaf0;
    font-family:"Great Vibes",cursive;
    font-size:clamp(30px,8vw,52px);
    text-shadow:
    0 2px 5px rgba(50,20,10,.55),
    0 0 12px rgba(255,225,165,.35);
    animation:tapGlow 2.5s ease-in-out infinite;
}

@keyframes tapGlow{
    0%,100%{
        opacity:.75;
        transform:translateY(0);
    }
    50%{
        opacity:1;
        transform:translateY(-3px);
    }
}

/* MAIN */

#main{
    position:relative;
    z-index:2;
    width:100%;
}

/* SECTIONS */

.section{
    width:100%;
    position:relative;
    padding-left:14px;
    padding-right:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#parents{
    padding-top:18px;
    padding-bottom:14px;
}

#countdown{
    padding-top:12px;
    padding-bottom:16px;
}

/* ROUNDED VIDEO FRAMES */

.video-wrap{
    position:relative;
    width:min(94vw,500px);
    padding:7px;
    border:1px solid #b99752;
    border-radius:18px;
    background:rgba(255,250,240,.2);
    box-shadow:0 7px 25px rgba(75,40,25,.12);
}

.video-wrap::before{
    content:"";
    position:absolute;
    inset:3px;
    border:1px solid rgba(185,151,82,.72);
    border-radius:13px;
    pointer-events:none;
    z-index:5;
}

.video-wrap video{
    display:block;
    width:100%;
    height:auto;
    max-height:72vh;
    object-fit:cover;
    border-radius:11px;
}

/* CORNER FLOWERS */

.corner-flower{
    position:absolute;
    width:68px;
    height:68px;
    object-fit:contain;
    z-index:8;
    pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(70,40,20,.13));
}

.corner-flower.top-left{
    left:-21px;
    top:-17px;
    transform:rotate(-12deg);
}

.corner-flower.bottom-right{
    right:-21px;
    bottom:-19px;
    transform:rotate(168deg);
}

/* ROUNDED COUNTDOWN FRAME */

.countdown-frame{
    position:relative;
    width:min(96vw,700px);
    margin:0 auto;
    overflow:hidden;
    border:1px solid rgba(185,151,82,.75);
    border-radius:18px;
    box-shadow:0 7px 25px rgba(75,40,25,.1);
}

.countdown-frame > img{
    display:block;
    width:100%;
    height:auto;
    border-radius:17px;
}

.countdown-box{
    position:absolute;
    width:62%;
    left:19%;
    top:52%;
    transform:translateY(-50%);
    z-index:10;
}

.countdown-box .tickcounter{
    display:block!important;
    width:100%!important;
    height:0!important;
    position:relative!important;
    padding-bottom:25%!important;
    margin:0!important;
}

/* EVENT SECTIONS */

.event-section{
    padding-top:10px;
    padding-bottom:18px;
    transition:background .8s ease;
}

#mehndi{
    background:rgba(224,237,225,.20);
}

#shadi{
    background:rgba(240,229,199,.20);
}

#walima{
    background:rgba(246,220,227,.20);
}

.event-title{
    margin:2px 0 8px;
    font-family:"Great Vibes",cursive;
    font-size:clamp(43px,11vw,62px);
    font-weight:400;
    line-height:1;
    color:#743838;
    text-align:center;
}

/* EVENT ADDRESS */

.event-details{
    width:min(94vw,500px);
    text-align:center;
    margin:5px auto 10px;
    color:#6b3939;
}

.event-details .venue{
    font-size:20px;
    line-height:1.2;
}

.event-details .address{
    margin-top:3px;
    font-family:"Montserrat",sans-serif;
    font-size:9px;
    line-height:1.6;
    letter-spacing:.3px;
}

/* SMALL GOOGLE MAPS BUTTON */

.map-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:39px;
    padding:9px 20px;
    margin:4px auto 0;
    border:1px solid #b99752;
    border-radius:30px;
    background:rgba(255,250,240,.65);
    color:#743838;
    text-decoration:none;
    font-family:"Montserrat",sans-serif;
    font-size:10px;
    font-weight:500;
    letter-spacing:.7px;
    text-transform:uppercase;
    box-shadow:0 4px 12px rgba(75,40,25,.08);
    transition:background .25s ease,transform .25s ease,box-shadow .25s ease;
}

.map-button:active{
    transform:scale(.97);
    background:rgba(222,194,133,.3);
}

.map-button .map-icon{
    width:15px;
    height:15px;
    flex-shrink:0;
}

/* ROUNDED DRESS CODE FRAME */

#dresscode{
    padding-top:16px;
    padding-bottom:20px;
}

.dress-image{
    width:min(94vw,600px);
    height:auto;
    display:block;
    padding:6px;
    border:1px solid #b99752;
    border-radius:18px;
    background:rgba(255,250,240,.2);
    box-shadow:0 7px 25px rgba(75,40,25,.12);
}

/* MOBILE */

@media(max-width:600px){

    .corner-flower{
        width:58px;
        height:58px;
    }

    .corner-flower.top-left{
        left:-17px;
        top:-15px;
    }

    .corner-flower.bottom-right{
        right:-17px;
        bottom:-17px;
    }

    .event-section{
        padding-top:8px;
        padding-bottom:15px;
    }

    .event-title{
        font-size:49px;
        margin-bottom:6px;
    }

    .video-wrap{
        width:94vw;
        padding:6px;
        border-radius:16px;
    }

    .video-wrap::before{
        border-radius:12px;
    }

    .video-wrap video{
        border-radius:10px;
    }

    .countdown-frame{
        width:96vw;
        border-radius:15px;
    }

    .countdown-frame > img{
        border-radius:14px;
    }

    .event-details .venue{
        font-size:18px;
    }

    .event-details .address{
        font-size:8px;
    }

    .map-button{
        min-height:37px;
        padding:9px 18px;
        font-size:9px;
    }

    .dress-image{
        border-radius:15px;
    }
}

@media(prefers-reduced-motion:reduce){
    html{
        scroll-behavior:auto;
    }

    .sparkle,
    #tapText{
        animation:none;
    }
}
</style>
</head>

<body>

<div id="background" class="original"></div>
<div id="glitter"></div>

<!-- MUSIC -->

<audio id="music" src="./dekha%20tenu.mp3" preload="auto" loop></audio>

<button id="soundButton" type="button">🔇 Sound: Off</button>

<!-- DOOR OPENING GATE -->

<div id="gate">

    <img
        id="doorStill"
        src="./door.JPEG"
        alt="Wedding Invitation"
    >

    <video
        id="doorVideo"
        src="./darwaza.mp4"
        muted
        playsinline
        webkit-playsinline
        preload="auto">
    </video>

    <div id="tapArea">
        <div id="tapText">Tap to Open Invitation</div>
    </div>

</div>

<!-- MAIN INVITATION -->

<main id="main">

    <!-- PARENTS VIDEO -->

    <section id="parents" class="section">
        <div class="video-wrap">
            <img
                class="corner-flower top-left"
                src="https://files.catbox.moe/kgdqjb.png"
                alt=""
            >

            <img
                class="corner-flower bottom-right"
                src="https://files.catbox.moe/kgdqjb.png"
                alt=""
            >

            <video
                src="./parents.mp4"
                autoplay
                muted
                loop
                playsinline
                webkit-playsinline
                preload="metadata">
            </video>
        </div>
    </section>

    <!-- COUNTDOWN -->

    <section id="countdown" class="section">
        <div class="countdown-frame">

            <img
                src="https://files.catbox.moe/eokc8y.jpeg"
                alt="Counting Days"
            >

            <div class="countdown-box">

                <script>
                (function(d,s,id){
                    var js,pjs=d.getElementsByTagName(s)[0];

                    if(d.getElementById(id)) return;

                    js=d.createElement(s);
                    js.id=id;
                    js.src="https://www.tickcounter.com/static/js/loader.js";

                    pjs.parentNode.insertBefore(js,pjs);
                }(document,"script","tickcounter-sdk"));
                </script>

                <a
                    data-type="countdown"
                    data-id="11468420"
                    class="tickcounter"
                    style="display:block;left:0;width:100%;height:0;position:relative;padding-bottom:25%;margin:0 auto;"
                    title="My countdown"
                    href="https://www.tickcounter.com/">
                    My countdown
                </a>

            </div>
        </div>
    </section>

    <!-- MEHNDI -->

    <section id="mehndi" class="section event-section" data-bg="green">

        <h2 class="event-title">Mehndi</h2>

        <div class="video-wrap">

            <img
                class="corner-flower top-left"
                src="https://files.catbox.moe/kgdqjb.png"
                alt=""
            >

            <img
                class="corner-flower bottom-right"
                src="https://files.catbox.moe/kgdqjb.png"
                alt=""
            >

            <video
                src="./mehndi.mp4"
                autoplay
                muted
                loop
                playsinline
                webkit-playsinline
                preload="metadata">
            </video>

        </div>

        <div class="event-details">
            <div class="venue">Le Aura Grand Events &amp; Hotel</div>
            <div class="address">Lahore, Pakistan</div>
        </div>

        <a
            class="map-button"
            href="https://www.google.com/maps?q=31.5204,74.3587"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View Mehndi location on Google Maps">

            <svg class="map-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                <circle cx="12" cy="10" r="2.5"/>
            </svg>

            View on Google Maps
        </a>

    </section>

    <!-- SHADI -->

    <section id="shadi" class="section event-section" data-bg="gold">

        <h2 class="event-title">Shadi</h2>

        <div class="video-wrap">

            <img
                class="corner-flower top-left"
                src="https://files.catbox.moe/kgdqjb.png"
                alt=""
            >

            <img
                class="corner-flower bottom-right"
                src="https://files.catbox.moe/kgdqjb.png"
                alt=""
            >

            <video
                src="./shadi.mp4"
                autoplay
                muted
                loop
                playsinline
                webkit-playsinline
                preload="metadata">
            </video>

        </div>

        <div class="event-details">
            <div class="venue">Shershah Palace, Marquee &amp; Farmhouse</div>
            <div class="address">Adda Plot, Raiwind Road, Eden Park, Lahore</div>
        </div>

        <a
            class="map-button"
            href="https://www.google.com/maps?q=31.4075,74.2320"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View Shadi location on Google Maps">

            <svg class="map-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                <circle cx="12" cy="10" r="2.5"/>
            </svg>

            View on Google Maps
        </a>

    </section>

    <!-- WALIMA -->

    <section id="walima" class="section event-section" data-bg="pink">

        <h2 class="event-title">Walima</h2>

        <div class="video-wrap">

            <img
                class="corner-flower top-left"
                src="https://files.catbox.moe/kgdqjb.png"
                alt=""
            >

            <img
                class="corner-flower bottom-right"
                src="https://files.catbox.moe/kgdqjb.png"
                alt=""
            >

            <video
                src="./Walima.mp4"
                autoplay
                muted
                loop
                playsinline
                webkit-playsinline
                preload="metadata">
            </video>

        </div>

        <div class="event-details">
            <div class="venue">Grand Vista</div>
            <div class="address">Lahore, Pakistan</div>
        </div>

        <a
            class="map-button"
            href="https://www.google.com/maps?q=31.5204,74.3587"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View Walima location on Google Maps">

            <svg class="map-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                <circle cx="12" cy="10" r="2.5"/>
            </svg>

            View on Google Maps
        </a>

    </section>

    <!-- DRESS CODE -->

    <section id="dresscode" class="section event-section" data-bg="pink">

        <img
            class="dress-image"
            src="https://files.catbox.moe/vxcqqa.png"
            alt="Dress Code"
        >

    </section>

</main>

<script>

/* GLITTER */

const glitter=document.getElementById("glitter");

for(let i=0;i<38;i++){

    const sparkle=document.createElement("span");

    sparkle.className="sparkle";
    sparkle.style.left=Math.random()*100+"%";
    sparkle.style.top=Math.random()*100+"%";
    sparkle.style.animationDelay=Math.random()*4+"s";
    sparkle.style.animationDuration=3+Math.random()*4+"s";

    glitter.appendChild(sparkle);
}

/* DOOR GATE */

const gate=document.getElementById("gate");
const doorStill=document.getElementById("doorStill");
const doorVideo=document.getElementById("doorVideo");
const tapArea=document.getElementById("tapArea");
const music=document.getElementById("music");
const soundButton=document.getElementById("soundButton");

let gateOpened=false;

doorVideo.load();

function openGate(){

    if(gateOpened) return;

    gateOpened=true;

    /* Start background music after the tap */

    music.volume=1;

    music.play()
    .then(()=>{
        soundButton.textContent="🔊 Sound: On";
    })
    .catch(()=>{
        soundButton.textContent="🔇 Sound: Off";
    });

    /* Play door-opening video silently */

    doorVideo.muted=true;
    doorVideo.volume=0;

    try{
        doorVideo.currentTime=0;
    }catch(e){}

    const playPromise=doorVideo.play();

    if(playPromise){
        playPromise.catch(()=>{
            gateOpened=false;
        });
    }

    /* Crossfade the still image into the video */

    setTimeout(()=>{
        doorVideo.style.opacity="1";
        doorStill.style.opacity="0";
        tapArea.style.opacity="0";
    },140);

    setTimeout(()=>{
        tapArea.style.display="none";
    },750);
}

/* TAP TO OPEN */

doorStill.addEventListener("click",openGate);
tapArea.addEventListener("click",openGate);

doorStill.addEventListener("touchend",function(e){
    e.preventDefault();
    openGate();
},{passive:false});

tapArea.addEventListener("touchend",function(e){
    e.preventDefault();
    openGate();
},{passive:false});

/* SHOW INVITATION AFTER DOOR VIDEO ENDS */

doorVideo.addEventListener("ended",function(){

    gate.classList.add("hidden");

    setTimeout(()=>{
        gate.style.display="none";
    },1300);
});

/* SOUND BUTTON */

soundButton.addEventListener("click",function(e){

    e.stopPropagation();

    if(music.paused){

        music.play()
        .then(()=>{
            soundButton.textContent="🔊 Sound: On";
        })
        .catch(()=>{
            soundButton.textContent="🔇 Sound: Off";
        });

    }else{

        music.pause();
        soundButton.textContent="🔇 Sound: Off";

    }
});

/* BACKGROUND COLOR ON EVENT SCROLL */

const background=document.getElementById("background");

const sections=document.querySelectorAll(".event-section");

const observer=new IntersectionObserver(function(entries){

    entries.forEach(entry=>{

        if(!entry.isIntersecting) return;

        const bg=entry.target.dataset.bg;

        if(bg==="pink") background.className="pink";
        if(bg==="green") background.className="green";
        if(bg==="gold") background.className="gold";

    });

},{threshold:.35});

sections.forEach(section=>observer.observe(section));

/* RESTORE ORIGINAL BACKGROUND AT COUNTDOWN */

const countdown=document.getElementById("countdown");

const originalObserver=new IntersectionObserver(function(entries){

    entries.forEach(entry=>{

        if(entry.isIntersecting){
            background.className="original";
        }

    });

},{threshold:.35});

originalObserver.observe(countdown);

/* MOBILE VIDEO SUPPORT */

document.querySelectorAll("video").forEach(video=>{

    video.setAttribute("playsinline","");
    video.setAttribute("webkit-playsinline","");

});

</script>

</body>
</html>
