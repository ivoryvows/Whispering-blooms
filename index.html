<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whispering Blooms</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    background:#faf7f1;
    color:#4b2630;
    font-family:'Montserrat', sans-serif;
    overflow-x:hidden;
}


/* =====================================================
   CONTINUOUS WEBSITE BACKGROUND
===================================================== */

.page{
    position:relative;
    min-height:100vh;
    overflow:hidden;
}

/* clean ivory background */

.page::before{
    content:"";
    position:fixed;
    inset:0;
    background:#faf7f1;
    z-index:-10;
}


/* =====================================================
   SMALL SIDE FLORAL DECORATIONS
===================================================== */

.floral{
    position:fixed;
    width:145px;
    height:240px;
    pointer-events:none;
    z-index:-2;
    opacity:.72;
}

.floral.left{
    left:-48px;
    top:16%;
}

.floral.right{
    right:-48px;
    top:55%;
    transform:scaleX(-1);
}


/* stems */

.stem{
    position:absolute;
    width:1px;
    height:150px;
    background:#89907a;
    transform-origin:bottom;
    left:70px;
    bottom:10px;
    transform:rotate(-18deg);
}


/* leaves */

.leaf{
    position:absolute;
    width:26px;
    height:13px;
    border:1px solid #89907a;
    border-radius:100% 0 100% 0;
    background:rgba(150,160,132,.12);
}

.leaf.one{
    left:45px;
    top:100px;
    transform:rotate(-30deg);
}

.leaf.two{
    left:82px;
    top:125px;
    transform:rotate(30deg);
}

.leaf.three{
    left:52px;
    top:150px;
    transform:rotate(-25deg);
}

.leaf.four{
    left:88px;
    top:75px;
    transform:rotate(35deg);
}


/* =====================================================
   FLOWER BUNCH
===================================================== */

.flower{
    position:absolute;
    width:42px;
    height:42px;
}


/* petals */

.flower span{
    position:absolute;
    width:21px;
    height:28px;
    border-radius:55% 55% 45% 45%;
    transform-origin:bottom center;
}

.flower span:nth-child(1){
    left:10px;
    top:0;
    transform:rotate(0deg);
}

.flower span:nth-child(2){
    left:20px;
    top:8px;
    transform:rotate(72deg);
}

.flower span:nth-child(3){
    left:14px;
    top:18px;
    transform:rotate(144deg);
}

.flower span:nth-child(4){
    left:2px;
    top:17px;
    transform:rotate(216deg);
}

.flower span:nth-child(5){
    left:0;
    top:7px;
    transform:rotate(288deg);
}


/* burgundy flower */

.flower.burgundy span{
    background:rgba(105,31,46,.82);
}


/* peach flower */

.flower.peach span{
    background:rgba(218,159,135,.72);
}


/* small white flowers */

.flower.small{
    transform:scale(.52);
}

.flower.small span{
    background:rgba(255,255,255,.92);
}


/* flower positions */

.flower.f1{
    left:30px;
    top:30px;
}

.flower.f2{
    left:80px;
    top:62px;
    transform:scale(.72);
}

.flower.f3{
    left:38px;
    top:110px;
    transform:scale(.65);
}

.flower.f4{
    left:88px;
    top:145px;
    transform:scale(.45);
}

.flower.f5{
    left:15px;
    top:165px;
    transform:scale(.38);
}


/* =====================================================
   PEARL STRAND
===================================================== */

.pearl{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#fff;
    border:1px solid #ddd5ca;
    box-shadow:0 1px 4px rgba(80,60,50,.18);
}

.p1{left:112px;top:20px}
.p2{left:119px;top:35px}
.p3{left:122px;top:51px}
.p4{left:119px;top:67px}
.p5{left:111px;top:82px}
.p6{left:101px;top:97px}
.p7{left:88px;top:110px}
.p8{left:75px;top:122px}


/* =====================================================
   BUTTERFLIES
===================================================== */

.butterfly{
    position:absolute;
    width:22px;
    height:18px;
    animation:floatButterfly 5s ease-in-out infinite;
}

.butterfly::before,
.butterfly::after{
    content:"";
    position:absolute;
    width:11px;
    height:15px;
    background:#741f32;
    opacity:.72;
}

.butterfly::before{
    left:0;
    top:0;
    border-radius:80% 20% 70% 30%;
    transform:rotate(25deg);
}

.butterfly::after{
    right:0;
    top:0;
    border-radius:20% 80% 30% 70%;
    transform:rotate(-25deg);
}

.butterfly.b1{
    left:108px;
    top:125px;
}

.butterfly.b2{
    left:30px;
    top:205px;
    transform:scale(.7);
    animation-delay:1.5s;
}

@keyframes floatButterfly{
    0%,100%{
        transform:translate(0,0) rotate(0deg);
    }
    50%{
        transform:translate(5px,-8px) rotate(4deg);
    }
}


/* =====================================================
   CONTENT
===================================================== */

.content{
    position:relative;
    z-index:2;
}


/* =====================================================
   GENERAL SECTIONS
===================================================== */

section{
    width:100%;
    padding:55px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.section-title{
    font-family:'Cormorant Garamond',serif;
    font-size:38px;
    font-weight:500;
    color:#681f30;
    margin:0 0 22px;
    text-align:center;
}

.subtitle{
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    color:#85626a;
    text-align:center;
    letter-spacing:1px;
}


/* =====================================================
   GATE
===================================================== */

#gate{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    background:#faf7f1;
    z-index:1000;
    overflow:hidden;
    cursor:pointer;
}

#gateVideo{
    width:100%;
    height:100%;
    object-fit:cover;
}

.tap-text{
    position:absolute;
    left:50%;
    bottom:12%;
    transform:translateX(-50%);
    color:white;
    font-family:'Cormorant Garamond',serif;
    font-size:30px;
    font-style:italic;
    letter-spacing:2px;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
    transition:opacity 1s ease;
    white-space:nowrap;
}

.gate-reveal{
    display:none;
}


/* =====================================================
   WELCOME VIDEO
===================================================== */

.video-section{
    padding:0 12px 12px;
}

.main-video{
    display:block;
    width:100%;
    max-width:900px;
    height:auto;
    margin:0 auto;
    border-radius:0;
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown-box{
    width:100%;
    max-width:650px;
    text-align:center;
    padding:35px 15px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
}

.time-box{
    min-width:72px;
}

.time-number{
    font-family:'Cormorant Garamond',serif;
    font-size:42px;
    color:#681f30;
}

.time-label{
    font-size:10px;
    letter-spacing:2px;
    color:#8b7777;
}


/* =====================================================
   EVENT SECTIONS
===================================================== */

.event-section{
    padding-top:35px;
    padding-bottom:0;
}

.event-video{
    width:100%;
    max-width:900px;
    display:block;
    margin:0 auto;
}

.map-section{
    padding-top:0;
    padding-bottom:30px;
}

.map{
    width:100%;
    max-width:900px;
    height:280px;
    border:0;
    display:block;
}


/* =====================================================
   DRESS CODE
===================================================== */

.dress-section{
    padding-top:55px;
}

.dress-video{
    width:100%;
    max-width:900px;
    display:block;
}


/* =====================================================
   RSVP
===================================================== */

.rsvp{
    min-height:100vh;
    padding:70px 22px;
}

.rsvp-card{
    width:100%;
    max-width:600px;
    padding:45px 25px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(120,70,70,.18);
}

.rsvp-title{
    font-family:'Cormorant Garamond',serif;
    font-size:48px;
    color:#681f30;
    text-align:center;
    margin:0 0 10px;
}

.rsvp-subtitle{
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    color:#80616a;
    margin-bottom:30px;
}

form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

label{
    font-size:12px;
    letter-spacing:1px;
    color:#633b43;
}

input,
select{
    width:100%;
    padding:14px;
    border:1px solid #d8c8c4;
    background:rgba(255,255,255,.7);
    font-family:'Montserrat',sans-serif;
    outline:none;
}

button{
    margin-top:8px;
    padding:15px;
    border:0;
    background:#681f30;
    color:white;
    font-family:'Montserrat',sans-serif;
    letter-spacing:2px;
    cursor:pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .floral{
        width:120px;
        transform:scale(.82);
        opacity:.62;
    }

    .floral.left{
        left:-58px;
        top:18%;
    }

    .floral.right{
        right:-58px;
        top:60%;
    }

        padding-left:14px;
        padding-right:14px;
    }

    .section-title{
        font-size:34px;
    }

    .tap-text{
        font-size:26px;
    }

    .map{
        height:250px;
    }

    .rsvp-title{
        font-size:42px;
    }

}

</style>
</head>

<script>

/* =====================================================
   GATE OPENING
===================================================== */

const gate = document.getElementById("gate");
const gateVideo = document.getElementById("gateVideo");
const tapText = document.getElementById("tapText");

let gateStarted = false;

gate.addEventListener("click", function(){

    if(gateStarted) return;

    gateStarted = true;

    tapText.style.opacity = "0";

    gateVideo.play();

});


/*
   Around 9 seconds:
   gate disappears so the scrolling invitation
   underneath becomes visible.
*/

gateVideo.addEventListener("timeupdate", function(){

    if(
        gateVideo.duration &&
        gateVideo.currentTime >= Math.max(
            gateVideo.duration - 2,
            9
        )
    ){

        if(gate.style.opacity !== "0"){

            gate.style.transition =
                "opacity 1.2s ease";

            gate.style.opacity = "0";

            setTimeout(function(){

                gate.style.display = "none";

            },1200);

        }

    }

});


/* =====================================================
   COUNTDOWN
===================================================== */


/*
   CHANGE THIS DATE TO YOUR WEDDING DATE
*/

const weddingDate =
    new Date("December 31, 2026 20:00:00").getTime();


function updateCountdown(){

    const now = new Date().getTime();

    const difference =
        weddingDate - now;


    if(difference <= 0){

        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";

        return;

    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    const hours =
        Math.floor(
            (difference %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );

    const minutes =
        Math.floor(
            (difference %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );

    const seconds =
        Math.floor(
            (difference %
            (1000 * 60)) /
            1000
        );


    document.getElementById("days").innerText =
        String(days).padStart(2,"0");

    document.getElementById("hours").innerText =
        String(hours).padStart(2,"0");

    document.getElementById("minutes").innerText =
        String(minutes).padStart(2,"0");

    document.getElementById("seconds").innerText =
        String(seconds).padStart(2,"0");

}


updateCountdown();

setInterval(updateCountdown,1000);

</script>
