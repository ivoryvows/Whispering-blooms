<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Whispering Blooms</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#fbf6ef;
    color:#51353b;
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
    position:relative;
}


/* =========================
   DREAMY IVORY BACKGROUND
========================= */

body::before,
body::after{
    content:"";
    position:fixed;
    top:0;
    bottom:0;
    width:145px;
    z-index:0;
    pointer-events:none;
    opacity:.62;
}


/* LEFT FLORALS */

body::before{
    left:0;

    background:

    /* burgundy roses */
    radial-gradient(
        circle at 8% 7%,
        rgba(111,42,55,.38) 0 18px,
        transparent 20px
    ),

    radial-gradient(
        circle at 24% 12%,
        rgba(124,49,62,.28) 0 14px,
        transparent 16px
    ),

    /* peach flowers */
    radial-gradient(
        circle at 4% 20%,
        rgba(238,173,153,.43) 0 23px,
        transparent 25px
    ),

    radial-gradient(
        circle at 25% 27%,
        rgba(247,194,174,.38) 0 18px,
        transparent 20px
    ),

    /* white blossoms */
    radial-gradient(
        circle at 10% 37%,
        rgba(255,255,250,.92) 0 11px,
        transparent 13px
    ),

    radial-gradient(
        circle at 28% 41%,
        rgba(255,255,250,.8) 0 9px,
        transparent 11px
    ),

    /* burgundy flowers */
    radial-gradient(
        circle at 3% 55%,
        rgba(119,43,57,.30) 0 20px,
        transparent 22px
    ),

    radial-gradient(
        circle at 24% 64%,
        rgba(130,51,64,.28) 0 15px,
        transparent 17px
    ),

    /* peach */
    radial-gradient(
        circle at 8% 76%,
        rgba(236,166,147,.40) 0 22px,
        transparent 24px
    ),

    radial-gradient(
        circle at 28% 86%,
        rgba(245,190,170,.35) 0 18px,
        transparent 20px
    ),

    /* soft green leaves */
    radial-gradient(
        ellipse at 45% 18%,
        rgba(116,139,101,.23) 0 15px,
        transparent 17px
    ),

    radial-gradient(
        ellipse at 40% 72%,
        rgba(112,137,97,.20) 0 16px,
        transparent 18px
    );

    filter:blur(1.2px);
}


/* RIGHT FLORALS */

body::after{
    right:0;

    background:

    radial-gradient(
        circle at 92% 8%,
        rgba(111,42,55,.36) 0 18px,
        transparent 20px
    ),

    radial-gradient(
        circle at 76% 14%,
        rgba(124,49,62,.27) 0 14px,
        transparent 16px
    ),

    radial-gradient(
        circle at 97% 23%,
        rgba(238,173,153,.42) 0 23px,
        transparent 25px
    ),

    radial-gradient(
        circle at 76% 31%,
        rgba(247,194,174,.36) 0 18px,
        transparent 20px
    ),

    radial-gradient(
        circle at 91% 40%,
        rgba(255,255,250,.9) 0 10px,
        transparent 12px
    ),

    radial-gradient(
        circle at 74% 50%,
        rgba(119,43,57,.30) 0 20px,
        transparent 22px
    ),

    radial-gradient(
        circle at 96% 62%,
        rgba(130,51,64,.28) 0 16px,
        transparent 18px
    ),

    radial-gradient(
        circle at 77% 75%,
        rgba(236,166,147,.40) 0 22px,
        transparent 24px
    ),

    radial-gradient(
        circle at 96% 87%,
        rgba(245,190,170,.35) 0 18px,
        transparent 20px
    ),

    radial-gradient(
        ellipse at 55% 20%,
        rgba(116,139,101,.22) 0 15px,
        transparent 17px
    ),

    radial-gradient(
        ellipse at 60% 72%,
        rgba(112,137,97,.20) 0 16px,
        transparent 18px
    );

    filter:blur(1.2px);
}


/* =========================
   GOLD DECORATIVE LINES
========================= */

body{
    background-image:

    linear-gradient(
        90deg,
        transparent 0%,
        rgba(183,145,94,.08) 3%,
        transparent 10%,
        transparent 90%,
        rgba(183,145,94,.08) 97%,
        transparent 100%
    );

}


/* =========================
   CONTENT
========================= */

main,
section,
header,
footer{
    position:relative;
    z-index:2;
}

section{
    width:100%;
    padding:24px 14px !important;
    margin:0 !important;
    min-height:auto !important;
}

section + section{
    padding-top:12px !important;
}


/* =========================
   GENERAL TEXT
========================= */

h1,
h2,
h3{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    color:#713d49;
}

h1{
    font-size:clamp(38px,10vw,70px);
}

h2{
    font-size:clamp(30px,8vw,50px);
    margin-bottom:8px;
}

p{
    line-height:1.6;
}


/* =========================
   VIDEOS
========================= */

video{
    display:block;
    width:100%;
    max-width:900px;
    height:auto;
    margin:0 auto;
    border-radius:12px;
}


/* =========================
   GATE
========================= */

#gate{
    position:relative;
    width:100%;
    height:100vh;
    min-height:100vh;
    padding:0 !important;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#gateVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:0;
}

#tapText{
    position:absolute;
    z-index:5;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:32px;
    color:white;

    text-shadow:
        0 1px 8px rgba(70,30,40,.7),
        0 0 15px rgba(255,255,255,.3);

    animation:tapGlow 2.2s ease-in-out infinite;
    pointer-events:none;
}

@keyframes tapGlow{

    0%,100%{
        opacity:.72;
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.04);
    }
}


/* =========================
   GATE REVEAL
========================= */

#gateReveal{
    display:none;
    min-height:auto !important;
    padding:14px 15px !important;
    text-align:center;
}


/* =========================
   EVENT SECTIONS
========================= */

.event-section{
    padding:18px 10px !important;
    text-align:center;
}

.event-section video{
    margin-bottom:10px;
}

.event-map{
    width:100%;
    max-width:900px;
    margin:0 auto;
}

.event-map iframe{
    width:100%;
    min-height:250px;
    border:0;
    border-radius:12px;
}


/* =========================
   COUNTDOWN
========================= */

.countdown-section{
    text-align:center;
    padding:20px 12px !important;
}

.countdown-frame{
    position:relative;
    width:100%;
    max-width:700px;
    margin:0 auto;
}

.countdown-frame video{
    width:100%;
}

.countdown-overlay{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:none;
}

.countdown{
    display:flex;
    gap:12px;
    justify-content:center;
    align-items:center;
    font-family:'Cormorant Garamond',serif;
    color:#713d49;
    font-size:clamp(22px,6vw,38px);
}

.countdown-item{
    text-align:center;
}

.countdown-number{
    font-size:1.4em;
}

.countdown-label{
    display:block;
    font-family:'Montserrat',sans-serif;
    font-size:9px;
    letter-spacing:1px;
    text-transform:uppercase;
}


/* =========================
   DRESS CODE
========================= */

.dress-section{
    text-align:center;
    padding:20px 12px !important;
}


/* =========================
   RSVP
========================= */

.rsvp-section{
    text-align:center;
    padding:25px 14px !important;
}

.rsvp-box{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:20px 16px;
    background:rgba(255,250,244,.55);
    border:1px solid rgba(157,110,92,.18);
    border-radius:16px;
    backdrop-filter:blur(3px);
}

.rsvp-box input,
.rsvp-box select{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid rgba(125,75,84,.25);
    border-radius:8px;
    background:rgba(255,255,255,.7);
    font-family:'Montserrat',sans-serif;
}

.rsvp-button{
    margin-top:10px;
    padding:12px 25px;
    border:0;
    border-radius:30px;
    background:#713d49;
    color:white;
    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    cursor:pointer;
}


/* =========================
   PEARLS
========================= */

.pearl{
    position:fixed;
    width:7px;
    height:7px;
    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            white 0 20%,
            rgba(255,255,255,.85) 35%,
            rgba(208,188,174,.45) 70%,
            transparent 100%
        );

    box-shadow:
        0 0 6px rgba(255,255,255,.8);

    opacity:.55;
    z-index:1;
    pointer-events:none;
}

.p1{
    left:6%;
    top:18%;
}

.p2{
    right:7%;
    top:34%;
}

.p3{
    left:8%;
    top:58%;
}

.p4{
    right:6%;
    top:73%;
}

.p5{
    left:12%;
    top:91%;
}


/* =========================
   BUTTERFLIES
========================= */

.butterfly{
    position:fixed;
    z-index:1;
    pointer-events:none;

    font-size:17px;
    opacity:.20;

    animation:
        butterflyFloat 8s ease-in-out infinite;
}

.b1{
    left:6%;
    top:25%;
}

.b2{
    right:6%;
    top:48%;
    animation-delay:2s;
}

.b3{
    left:8%;
    top:82%;
    animation-delay:4s;
}

@keyframes butterflyFloat{

    0%,100%{
        transform:translateY(0) rotate(-5deg);
    }

    50%{
        transform:translateY(-13px) rotate(5deg);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body::before,
    body::after{
        width:95px;
        opacity:.52;
    }

    section{
        padding:20px 10px !important;
    }

    section + section{
        padding-top:10px !important;
    }

    .event-section{
        padding:15px 8px !important;
    }

    .countdown-section{
        padding:16px 8px !important;
    }

    .dress-section{
        padding:16px 8px !important;
    }

    .rsvp-section{
        padding:18px 8px !important;
    }

    video{
        border-radius:9px;
    }

    #tapText{
        font-size:28px;
    }
}

</style>
</head>


<body>


<!-- =========================
     SUBTLE PEARLS
========================= -->

<div class="pearl p1"></div>

<div class="pearl p3"></div>
<div class="pearl p4"></div>
<div class="pearl p5"></div>


<!-- =========================
     SUBTLE BUTTERFLIES
========================= -->

<div class="butterfly b1">🦋</div>
<div class="butterfly b2">🦋</div>
<div class="butterfly b3">🦋</div>



<!-- =========================
     OPENING GATE
========================= -->

<section id="gate">

    <video

        playsinline

        <!-- PUT YOUR GATE VIDEO LINK HERE -->

        >

    </video>


    <div id="tapText">

    </div>

</section>



<!-- =========================

========================= -->

<section id="gateReveal">

    <h1>Whispering Blooms</h1>

    <p>
        With hearts full of joy,
        we invite you to celebrate
        these beautiful moments with us.
    </p>

</section>



<!-- =========================

========================= -->

<section>

    <video
        playsinline

        preload="metadata"
    >

        <!-- PUT YOUR WE REQUEST YOU VIDEO LINK HERE -->

            src=""

<!-- =========================

========================= -->

<script>

/* =========================
   GATE VIDEO
========================= */

const gate =
    document.getElementById("gate");

const gateVideo =
    document.getElementById("gateVideo");

const tapText =
    document.getElementById("tapText");

const gateReveal =
    document.getElementById("gateReveal");


let gateStarted = false;


/*
   Tap anywhere on opening video
*/

gate.addEventListener(
    "click",
    function(){

        if(gateStarted){
            return;
        }

        gateStarted = true;

        tapText.style.opacity = "0";

        gateVideo.muted = false;

        gateVideo.play().catch(
            function(){
                gateVideo.muted = true;
                gateVideo.play();
            }
        );

    }
);



/*
   Around 9 seconds:
   opening part disappears
   text/reveal remains
*/

gateVideo.addEventListener(
    "timeupdate",
    function(){

        if(
            gateVideo.currentTime >= 9 &&
            !gate.classList.contains("revealing")
        ){

            gate.classList.add("revealing");

            gate.style.transition =
                "opacity 1.2s ease";

            gate.style.opacity = "0";


            setTimeout(
                function(){

                    gate.style.display =
                        "none";

                    gateReveal.style.display =
                        "block";

                    gateReveal.style.opacity =
                        "0";


                    requestAnimationFrame(
                        function(){

                            gateReveal.style.transition =
                                "opacity 1.2s ease";

                            gateReveal.style.opacity =
                                "1";

                        }
                    );

                },
                1200
            );

        }

    }
);



/* =========================
   COUNTDOWN
========================= */

/*
   CHANGE THIS DATE
   TO THE ACTUAL WEDDING DATE
*/

const weddingDate =
    new Date(
        "December 31, 2026 20:00:00"
    ).getTime();


function updateCountdown(){

    const now =
        new Date().getTime();

    const difference =
        weddingDate - now;


    if(difference <= 0){

        document.getElementById("days")
            .innerText = "00";

        document.getElementById("hours")
            .innerText = "00";

        document.getElementById("minutes")
            .innerText = "00";

        document.getElementById("seconds")
            .innerText = "00";

        return;

    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (difference %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (difference %
            (1000 * 60)) /
            1000
        );


    document.getElementById("days")
        .innerText =
        String(days).padStart(2,"0");


    document.getElementById("hours")
        .innerText =
        String(hours).padStart(2,"0");


    document.getElementById("minutes")
        .innerText =
        String(minutes).padStart(2,"0");


    document.getElementById("seconds")
        .innerText =
        String(seconds).padStart(2,"0");

}


updateCountdown();

setInterval(
    updateCountdown,
    1000
);

</script>
