<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Timeless Grace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BASIC
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    overflow-x:hidden;
    font-family:"Cormorant Garamond",serif;
    color:#5a3030;
    background:#f8f2e8;
}

/* =========================================================
   CONTINUOUS BACKGROUND
========================================================= */

#background{
    position:fixed;
    inset:0;
    z-index:-10;
    background:#f8f2e8;
    transition:background 1.4s ease;
}

/* Original background until countdown */
#background.original{
    background:
      radial-gradient(circle at 20% 20%,rgba(255,255,255,.8),transparent 35%),
      radial-gradient(circle at 80% 70%,rgba(239,225,207,.45),transparent 40%),
      #f8f2e8;
}

#background.pink{
    background:
      radial-gradient(circle at 15% 20%,rgba(255,255,255,.55),transparent 38%),
      radial-gradient(circle at 85% 75%,rgba(244,194,205,.45),transparent 40%),
      #f6dfe4;
}

#background.green{
    background:
      radial-gradient(circle at 15% 20%,rgba(255,255,255,.6),transparent 38%),
      radial-gradient(circle at 85% 75%,rgba(183,211,187,.5),transparent 42%),
      #e2eee3;
}

#background.gold{
    background:
      radial-gradient(circle at 15% 20%,rgba(255,255,255,.65),transparent 38%),
      radial-gradient(circle at 85% 75%,rgba(225,198,143,.45),transparent 42%),
      #f1e7ca;
}

/* =========================================================
   GLITTER
========================================================= */

#glitter{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    overflow:hidden;
}

.sparkle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:rgba(174,137,67,.65);
    box-shadow:0 0 7px rgba(194,157,82,.65);
    animation:twinkle 4s ease-in-out infinite;
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.6);
    }
    50%{
        opacity:.8;
        transform:scale(1.4);
    }
}

/* =========================================================
   SOUND BUTTON
========================================================= */

#soundButton{
    position:fixed;
    right:14px;
    top:14px;
    z-index:99999;

    border:1px solid rgba(174,137,67,.7);
    background:rgba(255,250,240,.88);
    color:#743838;

    padding:8px 13px;
    border-radius:30px;

    font-family:"Montserrat",sans-serif;
    font-size:10px;
    letter-spacing:.5px;

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    box-shadow:0 3px 15px rgba(80,40,20,.12);
}

/* =========================================================
   MAIN CONTENT
========================================================= */

#main{
    position:relative;
    z-index:2;
    width:100%;
}

/* =========================================================
   GATE / OPENING
========================================================= */

#gate{
    position:fixed;
    inset:0;
    z-index:50000;
    overflow:hidden;
    background:#f8f2e8;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

#gate.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

/*
   STILL + VIDEO ARE EXACTLY SAME POSITION.
   This prevents the "jhatka".
*/

#doorStill,
#doorVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    display:block;
}

#doorStill{
    z-index:2;
    opacity:1;

    transition:opacity 1.15s ease;
}

#doorVideo{
    z-index:1;
    opacity:0;

    background:#f8f2e8;

    transition:opacity 1.15s ease;
}

/* Dark/gold subtle overlay */

#gate::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;

    background:
      linear-gradient(
        to bottom,
        rgba(35,10,10,.08),
        transparent 35%,
        rgba(35,10,10,.08)
      );
}

/* =========================================================
   TAP TO OPEN
========================================================= */

#tapArea{
    position:absolute;
    inset:0;
    z-index:10;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    padding-bottom:12vh;

    cursor:pointer;

    transition:opacity .6s ease;
}

#tapText{
    color:#fffaf0;

    font-family:"Great Vibes",cursive;
    font-size:clamp(30px,8vw,52px);

    text-shadow:
      0 2px 4px rgba(60,20,10,.5),
      0 0 12px rgba(255,231,173,.35);

    letter-spacing:.5px;

    animation:tapGlow 2.5s ease-in-out infinite;
}

@keyframes tapGlow{
    0%,100%{
        opacity:.72;
        transform:translateY(0);
    }
    50%{
        opacity:1;
        transform:translateY(-3px);
    }
}

/* =========================================================
   SECTION COMMON
========================================================= */

.section{
    position:relative;
    width:100%;

    padding:
      24px
      18px
      38px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/*
  Countdown and everything before it stays original.
*/

.original-section{
    background:transparent;
}

/* =========================================================
   EVENT SECTIONS
========================================================= */

.event-section{
    min-height:auto;

    padding-top:18px;
    padding-bottom:22px;

    transition:background .8s ease;
}

#dholki{
    background:rgba(246,223,228,.20);
}

#mehndi{
    background:rgba(226,238,227,.20);
}

#shadi{
    background:rgba(241,231,202,.20);
}

#walima{
    background:rgba(246,223,228,.20);
}

/* =========================================================
   EVENT HEADINGS
   ONLY CURSIVE — NO DUPLICATE NORMAL HEADINGS
========================================================= */

.event-title{
    margin:4px 0 10px;

    font-family:"Great Vibes",cursive;
    font-size:clamp(42px,11vw,65px);
    font-weight:400;

    color:#743838;

    line-height:1;

    text-align:center;

    text-shadow:
      0 1px 2px rgba(100,40,30,.12);
}

/* =========================================================
   VIDEO FRAME
========================================================= */

.video-wrap{
    position:relative;
    width:min(92vw,520px);

    margin:0 auto 8px;

    padding:7px;

    border:1px solid #b89752;

    background:rgba(255,250,240,.12);

    box-shadow:
      0 7px 25px rgba(85,45,25,.12);
}

/* Inner gold line */

.video-wrap::before{
    content:"";
    position:absolute;

    inset:3px;

    border:1px solid rgba(184,151,82,.72);

    pointer-events:none;

    z-index:5;
}

/* Video itself */

.video-wrap video{
    display:block;

    width:100%;
    height:auto;

    max-height:72vh;

    object-fit:cover;

    background:transparent;
}

/* =========================================================
   CORNER FLOWERS
   NOT FULL SIDE FLOWERS
========================================================= */

.corner-flower{
    position:absolute;

    width:72px;
    height:72px;

    object-fit:contain;

    z-index:8;

    pointer-events:none;

    opacity:.95;

    filter:
      drop-shadow(0 2px 3px rgba(70,40,20,.12));
}

/* Top-left */

.corner-flower.top-left{
    left:-22px;
    top:-18px;

    transform:rotate(-12deg);
}

/* Bottom-right */

.corner-flower.bottom-right{
    right:-22px;
    bottom:-20px;

    transform:rotate(168deg);
}

/*
  These are the only flowers around event videos.
*/

/* =========================================================
   ORIGINAL SECTION FLOWERS
========================================================= */

.original-frame{
    position:relative;
}

/* =========================================================
   PARENTS
========================================================= */

#parents{
    padding-top:18px;
    padding-bottom:20px;
}

#parents .video-wrap{
    margin-bottom:0;
}

/* =========================================================
   COUNTDOWN
========================================================= */

#countdown{
    padding-top:15px;
    padding-bottom:18px;
}

.countdown-frame{
    position:relative;

    width:min(94vw,700px);

    margin:0 auto;

    overflow:visible;
}

.countdown-frame img{
    display:block;

    width:100%;
    height:auto;
}

/* Exact tested countdown placement */

.countdown-box{
    position:absolute;

    width:62%;
    left:19%;
    top:52%;

    transform:translateY(-50%);

    z-index:10;

    line-height:normal;
}

.countdown-box .tickcounter{
    display:block !important;

    width:100% !important;
    height:0 !important;

    position:relative !important;

    padding-bottom:25% !important;

    margin:0 !important;
}

/* =========================================================
   EVENT VIDEO SIZES
========================================================= */

.event-section .video-wrap{
    width:min(92vw,500px);
}

/* Keep sections tight */

.event-section + .event-section{
    margin-top:0;
}

/* =========================================================
   DRESS CODE
========================================================= */

#dresscode{
    padding-top:20px;
    padding-bottom:24px;
}

.dress-image{
    width:min(94vw,600px);

    display:block;

    border:1px solid #b89752;

    padding:6px;

    box-shadow:0 7px 25px rgba(85,45,25,.12);
}

/* =========================================================
   RSVP
========================================================= */

#rsvp{
    padding-top:18px;
    padding-bottom:45px;
}

.rsvp-frame{
    position:relative;

    width:min(94vw,650px);

    margin:0 auto;
}

.rsvp-frame img{
    display:block;
    width:100%;
    height:auto;
}

.rsvp-form{
    position:absolute;

    left:17%;
    right:17%;

    top:24%;

    display:flex;
    flex-direction:column;

    gap:10px;

    z-index:5;
}

.rsvp-form input,
.rsvp-form select{
    width:100%;

    padding:10px 11px;

    border:none;
    border-bottom:1px solid rgba(255,245,220,.8);

    background:rgba(90,40,40,.16);

    color:#fffaf0;

    font-family:"Cormorant Garamond",serif;
    font-size:16px;

    outline:none;

    border-radius:0;
}

.rsvp-form input::placeholder{
    color:rgba(255,250,240,.85);
}

.rsvp-form select{
    color:#fffaf0;
}

.rsvp-form option{
    color:#4d2929;
    background:#fffaf0;
}

.rsvp-button{
    margin-top:7px;

    padding:11px;

    border:1px solid rgba(255,240,200,.9);

    background:rgba(92,42,42,.35);

    color:#fffaf0;

    font-family:"Great Vibes",cursive;

    font-size:23px;

    border-radius:2px;
}

#rsvpMessage{
    text-align:center;

    color:#fffaf0;

    font-family:"Great Vibes",cursive;

    font-size:25px;

    margin-top:5px;
}

/* =========================================================
   MAP
========================================================= */

.map-wrap{
    width:min(92vw,500px);

    margin:4px auto 10px;

    border:1px solid #b89752;

    padding:5px;

    background:rgba(255,250,240,.25);
}

.map-wrap iframe{
    display:block;

    width:100%;
    height:220px;

    border:0;
}

/* =========================================================
   SMALL EVENT DETAILS
========================================================= */

.event-details{
    text-align:center;

    margin-top:0;

    color:#6d3b3b;
}

.event-details .date{
    font-family:"Montserrat",sans-serif;

    font-size:10px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:4px;
}

.event-details .venue{
    font-size:21px;

    line-height:1.15;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .section{
        padding-left:12px;
        padding-right:12px;
    }

    .event-section{
        padding-top:12px;
        padding-bottom:17px;
    }

    .event-title{
        margin-top:2px;
        margin-bottom:7px;
        font-size:48px;
    }

    .video-wrap{
        width:94vw;
        padding:6px;
    }

    .video-wrap::before{
        inset:3px;
    }

    .corner-flower{
        width:60px;
        height:60px;
    }

    .corner-flower.top-left{
        left:-17px;
        top:-15px;
    }

    .corner-flower.bottom-right{
        right:-17px;
        bottom:-17px;
    }

    .countdown-frame{
        width:96vw;
    }

    .countdown-box{
        width:62%;
        left:19%;
        top:52%;
    }

    .map-wrap iframe{
        height:190px;
    }

    .rsvp-form{
        left:15%;
        right:15%;
        top:22%;
        gap:7px;
    }

    .rsvp-form input,
    .rsvp-form select{
        padding:7px 8px;
        font-size:14px;
    }

    .rsvp-button{
        padding:7px;
        font-size:21px;
    }
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    .corner-flower{
        width:52px;
        height:52px;
    }

    .rsvp-form{
        top:20%;
    }

    .rsvp-form input,
    .rsvp-form select{
        font-size:13px;
        padding:5px 7px;
    }
}

</style>
</head>

<script>

/* =========================================================
   GLITTER
========================================================= */

const glitter = document.getElementById("glitter");

for(let i = 0; i < 38; i++){

    const sparkle = document.createElement("span");

    sparkle.className = "sparkle";

    sparkle.style.left =
        Math.random() * 100 + "%";

    sparkle.style.top =
        Math.random() * 100 + "%";

    sparkle.style.animationDelay =
        (Math.random() * 4) + "s";

    sparkle.style.animationDuration =
        (3 + Math.random() * 4) + "s";

    glitter.appendChild(sparkle);
}


/* =========================================================
   GATE
   IMPORTANT:
   - still image and video occupy same layer
   - video is started immediately on tap
   - music starts from same tap
   - still image fades instead of disappearing
========================================================= */

const gate = document.getElementById("gate");
const doorStill = document.getElementById("doorStill");
const doorVideo = document.getElementById("doorVideo");
const tapArea = document.getElementById("tapArea");

const music = document.getElementById("music");
const soundButton = document.getElementById("soundButton");

let gateOpened = false;


/* Preload gate video */

doorVideo.load();


function openGate(){

    if(gateOpened) return;

    gateOpened = true;

    /*
      MUSIC:
      This call happens directly from the user's tap.
    */

    music.volume = 1;

    music.play()
        .then(() => {
            soundButton.textContent = "🔊 Sound: On";
        })
        .catch(() => {
            soundButton.textContent = "🔇 Sound: Off";
        });


    /*
      GATE VIDEO MUST STAY MUTED.
    */

    doorVideo.muted = true;
    doorVideo.volume = 0;

    try{
        doorVideo.currentTime = 0;
    }catch(e){}


    /*
      Start video immediately.
      We do NOT wait for the Promise to finish
      before beginning the visual transition.
    */

    const videoPromise = doorVideo.play();

    if(videoPromise){
        videoPromise.catch(() => {});
    }


    /*
      Give Safari a tiny moment to place the first
      video frame, then crossfade the still image.
    */

    setTimeout(() => {

        doorVideo.style.opacity = "1";
        doorStill.style.opacity = "0";
        tapArea.style.opacity = "0";

    }, 140);


    /*
      Remove tap layer after fade.
    */

    setTimeout(() => {

        tapArea.style.display = "none";

    }, 750);
}


/* Tap */

tapArea.addEventListener("click", openGate);
tapArea.addEventListener("touchend", function(e){

    e.preventDefault();
    openGate();

}, {passive:false});


/* =========================================================
   GATE VIDEO END
========================================================= */

doorVideo.addEventListener("ended", function(){

    /*
      Once door video finishes:
      fade entire gate away.
    */

    gate.classList.add("hidden");

    setTimeout(() => {

        gate.style.display = "none";

    }, 1300);

});


/* =========================================================
   SOUND TOGGLE
========================================================= */

soundButton.addEventListener("click", function(e){

    e.stopPropagation();

    if(music.paused){

        music.play()
            .then(() => {
                soundButton.textContent = "🔊 Sound: On";
            })
            .catch(() => {});

    }else{

        music.pause();

        soundButton.textContent = "🔇 Sound: Off";

    }

});


/* =========================================================
   BACKGROUND COLOR CHANGE
========================================================= */

const background = document.getElementById("background");

const eventSections =
    document.querySelectorAll(".event-section");


const bgObserver =
    new IntersectionObserver(
        function(entries){

            entries.forEach(entry => {

                if(!entry.isIntersecting) return;

                const color =
                    entry.target.dataset.bg;

                if(color === "pink"){

                    background.className = "pink";

                }

                if(color === "green"){

                    background.className = "green";

                }

                if(color === "gold"){

                    background.className = "gold";

                }

            });

        },
        {
            threshold:0.35
        }
    );


eventSections.forEach(section => {

    bgObserver.observe(section);

});


/*
  Keep original color while countdown / parents
  are visible.

  When the first event enters, the pastel sequence starts.
*/

const countdown =
    document.getElementById("countdown");


const originalObserver =
    new IntersectionObserver(
        function(entries){

            entries.forEach(entry => {

                if(entry.isIntersecting){

                    background.className = "original";

                }

            });

        },
        {
            threshold:0.35
        }
    );


originalObserver.observe(countdown);


/* =========================================================
   RSVP GOOGLE SHEET
========================================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwhcI7eEUuhAeb9LDD_iOQV1yOXX-iSxou8kYnM_B9J6Z9Fxjma_F5E0-zGMMi_fKo/exec";


const rsvpForm =
document.getElementById("rsvpForm");


const rsvpMessage =
document.getElementById("rsvpMessage");


rsvpForm.addEventListener("submit", function(e){

    e.preventDefault();

    const name =
        document.getElementById("guestName").value.trim();

    const attendance =
        document.getElementById("attendance").value;

    const guests =
        document.getElementById("guests").value;


    if(!name || !attendance || !guests){

        return;

    }


    const data = new URLSearchParams();

    data.append("name", name);
    data.append("attendance", attendance);
    data.append("guests", guests);
    data.append(
        "timestamp",
        new Date().toISOString()
    );


    rsvpMessage.textContent =
        "Sending your response ♡";


    fetch(
        SCRIPT_URL,
        {
            method:"POST",
            mode:"no-cors",
            body:data
        }
    )
    .then(() => {

        rsvpMessage.textContent =
            "Thank you for your response ♡";

        rsvpForm.reset();

    })
    .catch(() => {

        rsvpMessage.textContent =
            "Thank you for your response ♡";

    });

});

document.querySelectorAll("video").forEach(video => {

    video.setAttribute("webkit-playsinline","");

});
